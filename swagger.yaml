          - boolean
          - 'null'
          description: Whether this channel is private (invite-only). Defaults to false.
        kind:
          $ref: '#/components/schemas/CommunitySpaceKind'
        name:
          type: string
          example: general
    PostRoleMemberRequest:
      type: object
      description: Request to add a member to a role
      required:
      - user_id
      properties:
        user_id:
          type: string
          format: uuid
    PostRoleRequest:
      type: object
      description: Request to create a new role
      required:
      - name
      properties:
        name:
          type: string
    PostVoiceConfirmRequest:
      type: object
      properties:
        sfu_peer_id:
          type:
          - integer
          - 'null'
          format: int32
          description: |-
            SFU-assigned peer ID. `None` when the client is operating without an
            SFU connection (e.g. relay-only mode or SFU not yet configured). The
            `voice:join` broadcast fires regardless so other participants always see
            the new participant's tile.
          minimum: 0
    ProfileResponse:
      type: object
      description: A user's profile
      required:
      - id
      - user_id
      - name
      properties:
        id:
          type: string
          format: uuid
          example: 018c5b6e-0000-7000-0000-000000000001
        name:
          type: string
          example: Aoife
        user_id:
          type: string
          format: uuid
          example: 018c5b6e-0000-7000-0000-000000000001
    PublicKeyCredentialCreationOptionsJSON:
      description: |-
        Schema name mirrors the browser's global `PublicKeyCredentialCreationOptionsJSON` type.
        The openapi-generator maps this schema name to the browser global — no model is generated.
      default: null
    PublicKeyCredentialRequestOptionsJSON:
      description: |-
        Schema name mirrors the browser's global `PublicKeyCredentialRequestOptionsJSON` type.
        The openapi-generator maps this schema name to the browser global — no model is generated.
      default: null
    PutRolePermissionsRequest:
      type: object
      description: Request to replace a role's permissions
      required:
      - permissions
      properties:
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/Permission'
    PutSpaceOverwritesRequest:
      type: object
      description: Request body for `PUT /{id}/overwrites` — full replace of all overwrites for the space.
      required:
      - role_overwrites
      - user_overwrites
      properties:
        role_overwrites:
          type: array
          items:
            $ref: '#/components/schemas/RoleOverwrite'
        user_overwrites:
          type: array
          items:
            $ref: '#/components/schemas/UserOverwrite'
    PutUserPermissionsRequest:
      type: object
      description: Request body for setting a user's instance-level permissions.
      required:
      - permissions
      properties:
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/InstancePermission'
    RealtimeConfig:
      type: object
      description: |-
        Response for `GET /realtime/config`: how to reach the realtime plane.

        The client reads this once at startup. `webtransport_url` present means "try
        WebTransport, fall back to the WebSocket on failure"; absent means the
        instance runs no WebTransport endpoint and the WebSocket is the only leg.
        `cert_hash` is the SHA-256 digest (dotted lowercase hex) the client must pin
        — present only for a self-signed development endpoint; a production endpoint
        carries a CA-issued certificate and omits it.
      properties:
        cert_hash:
          type:
          - string
          - 'null'
        webtransport_url:
          type:
          - string
          - 'null'
          example: https://rt.hound.chat/realtime
    RefreshTokenResponse:
      type: object
      description: Response body containing a new access token and refresh token
      required:
      - access_token
      - expires_in
      - refresh_token
      properties:
        access_token:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIwMThjNWI2ZS0wMDAwLTcwMDAtMDAwMC0wMDAwMDAwMDAwMDEifQ.example
        expires_in:
          type: integer
          format: int64
          example: 2700
          minimum: 0
        refresh_token:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIwMThjNWI2ZS0wMDAwLTcwMDAtMDAwMC0wMDAwMDAwMDAwMDEiLCJ0eXAiOiJyZWZyZXNoIn0.example
    RelayTokenResponse:
      type: object
      description: |-
        Response for re-minting a relay token mid-call (`voice/relay-token`).

        Carries ONLY the fresh token — the client already has the relay URL and SFU
        node id from its `voice/join`, and the roster is maintained over the live
        control plane, so a refresh re-mints nothing else.
      required:
      - relay_token
      properties:
        relay_token:
          type: string
          description: |-
            Short-lived HMAC-SHA256 token (15 min TTL), same format as
            `VoiceJoinResponse::relay_token`: `{user_id}:{space_id}:{expiry}:{hex_mac}`.
    RoleOverwrite:
      type: object
      description: A single permission overwrite entry for a role.
      required:
      - role_id
      - permission
      - allow
      properties:
        allow:
          type: boolean
          description: '`true` = allow; `false` = deny.'
        permission:
          $ref: '#/components/schemas/Permission'
        role_id:
          type: string
          format: uuid
    RoleResponse:
      type: object
      description: A community role with its permissions
      required:
      - id
      - community_id
      - name
      - is_organisers
      - is_everyone
      - permissions
      properties:
        community_id:
          type: string
          format: uuid
        id:
          type: string
          format: uuid
        is_everyone:
          type: boolean
        is_organisers:
          type: boolean
        name:
          type: string
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/Permission'
    StartLoginRequest:
      type: object
      description: Request body for starting passkey login
      required:
      - email
      properties:
        email:
          type: string
          description: The user's email address.
          example: user@hound.chat
    StartLoginResponse:
      type: object
      description: Response body for starting passkey login
      required:
      - user_id
      - options
      properties:
        options:
          type: object
          description: Challenge from the server to pass to navigator.credentials.get()
          required:
          - publicKey
          properties:
            publicKey:
              $ref: '#/components/schemas/PublicKeyCredentialRequestOptionsJSON'
          examples:
          - publicKey:
              challenge: base64-challenge
              rpId: hound.chat
              timeout: 60000
              allowCredentials: []
        user_id:
          type: string
          format: uuid
          description: The user ID required to complete the passkey ceremony.
          example: 018c5b6e-0000-7000-0000-000000000001
    StartRegisterRequest:
      type: object
      description: Request body for starting passkey registration
      required:
      - email
      - display_name
      properties:
        display_name:
          type: string
          description: The name of the device that user is registering to their account.
          example: MacBook Pro
        email:
          type: string
          description: The user's email address used for verification.
          example: user@hound.chat
    StartRegisterResponse:
      type: object
      description: Response body for starting passkey registration
      required:
      - options
      - user_id
      properties:
        options:
          type: object
          description: Challenge from the server to pass to navigator.credentials.create()
          required:
          - publicKey
          properties:
            publicKey:
              $ref: '#/components/schemas/PublicKeyCredentialCreationOptionsJSON'
          examples:
          - publicKey:
              challenge: base64-challenge
              rpId: hound.chat
              timeout: 60000
        user_id:
          type: string
          format: uuid
          description: The provisional user ID to supply when finishing registration.
    SteamLinkRequest:
      type: object
      properties:
        link_token:
          type:
          - string
          - 'null'
          description: '`link_token` from a `status: unknown` login response (browser link).'
        ticket:
          type:
          - string
          - 'null'
          description: |-
            Steamworks WebAPI ticket (in-Steam link). Exactly one of `ticket` /
            `link_token` must be set.
    SteamLoginResponse:
      oneOf:
      - type: object
        description: 'The Steam ID is linked to an account: signed in.'
        required:
        - session
        - status
        properties:
          session:
            $ref: '#/components/schemas/FinishLoginResponse'
          status:
            type: string
            enum:
            - ok
      - type: object
        description: |-
          The Steam ID is unknown. The client must choose: register a new account
          (`/auth/steam/register`) or sign in and link (`/auth/identity/steam/link`),
          authorising either with `link_token`.
        required:
        - link_token
        - persona
        - status
        properties:
          avatar_url:
            type:
            - string
            - 'null'
          link_token:
            type: string
          persona:
            type: string
          status:
            type: string
            enum:
            - unknown
      description: Result of authenticating with Steam.
    SteamOpenIdVerifyRequest:
      type: object
      required:
      - params
      properties:
        link:
          type: boolean
          description: |-
            Link intent: the caller only wants proof of Steam-account ownership
            (a `link_token`), never a session — even when the Steam ID is already
            linked. Used by the settings "link Steam" browser flow.
        params:
          type: object
          description: |-
            The raw `openid.*` query params from Steam's return redirect, relayed
            verbatim by the auth service. Verification happens here: the backend is
            the trust root, and Steam honours one check per assertion.
          additionalProperties:
            type: string
          propertyNames:
            type: string
    SteamRegisterRequest:
      type: object
      required:
      - link_token
      - name
      properties:
        link_token:
          type: string
          description: '`link_token` from a `status: unknown` login response.'
        name:
          type: string
          description: Display name for the new account's global profile.
    SteamSessionRequest:
      type: object
      required:
      - ticket
      properties:
        ticket:
          type: string
          description: |-
            Hex-encoded ticket from `GetAuthTicketForWebApi` (identity
            "hound-backend-login").
    UploadResponse:
      type: object
      required:
      - id
      - url
      - content_type
      - size_bytes
      properties:
        content_type:
          type: string
          example: image/webp
        id:
          type: string
          format: uuid
          example: 018f1234-0000-7000-0000-000000000001
        size_bytes:
          type: integer
          format: int64
        url:
          type: string
          example: https://cdn.hound.chat/avatar/018c.../018f....webp
    UserOverwrite:
      type: object
      description: A single permission overwrite entry for a user.
      required:
      - user_id
      - permission
      - allow
      properties:
        allow:
          type: boolean
          description: '`true` = allow; `false` = deny.'
        permission:
          $ref: '#/components/schemas/Permission'
        user_id:
          type: string
          format: uuid
    VoiceJoinResponse:
      type: object
      description: |-
        Response for joining a voice channel.

        The client uses this to:
        1. Present `relay_token` to the SFU on connect (proves they are allowed in).
        2. Configure their iroh endpoint to use `relay_url` for NAT traversal.
        3. Render the participant list with `peers` before any media arrives.
      required:
      - profile
      - relay_url
      - relay_token
      - peers
      properties:
        peers:
          type: array
          items:
            $ref: '#/components/schemas/VoicePeerInfo'
          description: |-
            Other participants already in the channel at the time of joining.
            Populated from the in-memory voice-participant registry.
        profile:
          $ref: '#/components/schemas/MergedProfile'
          description: The joining user's merged community profile (name, avatar, etc.).
        relay_token:
          type: string
          description: |-
            Short-lived HMAC-SHA256 token (15 min TTL) that proves this user may
            connect to the SFU for the given voice channel.

            Format: `{user_id}:{space_id}:{expiry_unix_secs}:{hex_mac}`
        relay_url:
          type: string
          description: |-
            iroh relay URL. Clients must not hardcode this value — use whatever the
            server returns here so that changing relay infrastructure only requires
            a backend deploy, not a client release.
        sfu_node_id:
          type:
          - string
          - 'null'
          description: |-
            iroh node ID of the SFU (hex-encoded public key).

            `None` when the backend is not configured with `SFU_NODE_ID` (e.g. in
            development without a running SFU). Clients skip the direct QUIC
            connection when this is absent.
    VoicePeerInfo:
      type: object
      description: |-
        Minimal information about a voice channel participant.

        Clients use this to render participant avatars and names before any media
        arrives, and `sfu_peer_id` to map media/control peer ids to a user identity
        for peers who confirmed before the caller joined (their `voice:join`
        broadcast pre-dates the caller's socket subscription).
      required:
      - user_id
      - picture
      properties:
        name:
          type:
          - string
          - 'null'
          description: Display name (from community profile, falls back to global profile).
        picture:
          type: string
          description: Avatar URL.
        sfu_peer_id:
          type:
          - integer
          - 'null'
          format: int32
          description: |-
            The peer's SFU/control-plane peer id (reported via `voice/confirm`).
            `None` until they confirm.
          minimum: 0
        user_id:
          type: string
          format: uuid
          description: Stable UUID for this user. Matches the `user_id` in socket.io events.
    WebAuthnResponse:
      type: object
      description: WebAuthn relying party configuration
      required:
      - rp_id
      - origins
      properties:
        origins:
          type: array
          items:
            type: string
          example:
          - https://hound.chat
        rp_id:
          type: string
          example: hound.chat
    WebCredentials:
      type: object
      description: |-
        The `webcredentials` section: the `<TeamID>.<BundleID>` identifiers permitted to
        use passkeys for this domain.
      required:
      - apps
      properties:
        apps:
          type: array
          items:
            type: string
          example:
          - U6Z6284VJP.chat.hound.houndctl
  securitySchemes:
    refreshToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT refresh token used to obtain a new access token
    token:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT access token for authenticating API requests
