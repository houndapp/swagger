        - session
        - status
        properties:
          session:
            $ref: '#/components/schemas/FinishLoginResponse'
          status:
            type: string
            enum:
            - ok
      - type: object
        description: |-
          The email is unknown. The client must register
          (`/auth/magic/register`), authorising with `link_token`.
        required:
        - link_token
        - email
        - status
        properties:
          email:
            type: string
          link_token:
            type: string
          status:
            type: string
            enum:
            - unknown
      description: Result of redeeming a magic-link code.
    MergedProfile:
