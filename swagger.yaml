          type: string
          description: '`link_token` from a `status: unknown` verify response.'
    MagicStartRequest:
      type: object
      required:
      - email
      properties:
        callback:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/MagicCallback'
            description: |-
              Present when a same-device link click should redirect into the
